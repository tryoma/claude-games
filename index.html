<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>あそびの棚</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: a toy shelf — a short masthead, then game boxes on a 6-column shelf (2 wide on top, 3 below), each box showing its game in its own colors */
:root {
  --bg: #F3EEE4;
  --shelf: #E6DCCB;
  --card: #FFFDF8;
  --ink: #23262E;
  --muted: #6A6559;
  --line: #D8CDB9;
  --accent: #C9472E;
  --display: "Dela Gothic One", "Hiragino Kaku Gothic StdN", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1C22; --shelf: #23262E; --card: #2A2D36; --ink: #EEE9DF; --muted: #A49E92; --line: #3A3D47; --accent: #E87358;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1C22; --shelf: #23262E; --card: #2A2D36; --ink: #EEE9DF; --muted: #A49E92; --line: #3A3D47; --accent: #E87358;
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-weight: 500;
  line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding-block: 40px 56px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}
header { display: flex; flex-direction: column; gap: 6px; }
header h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(34px, 7vw, 56px);
  line-height: 1.1;
  letter-spacing: 0.02em;
  text-wrap: balance;
}
header h1 span { color: var(--accent); }
header p { margin: 0; color: var(--muted); max-width: 52ch; font-size: 15px; }

.shelf {
  background: var(--shelf);
  border-radius: 14px;
  padding: 14px;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 14px;
}
.game { grid-column: span 2; }
.game.wide { grid-column: span 3; }
@media (max-width: 860px) {
  .shelf { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .game, .game.wide { grid-column: span 1; }
  .game:last-child:nth-child(odd) { grid-column: span 2; }
}
@media (max-width: 560px) {
  .shelf { grid-template-columns: minmax(0, 1fr); padding: 10px; }
  .game, .game.wide, .game:last-child:nth-child(odd) { grid-column: auto; }
}

.game {
  background: var(--card);
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-width: 0;
  color: inherit;
  text-decoration: none;
  transition: transform 160ms ease, box-shadow 160ms ease;
}
.game:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,0.12); }
.game:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.thumb { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; max-width: 100%; object-fit: cover; }
.info { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.info h2 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: 22px;
  line-height: 1.25;
  text-wrap: balance;
}
.info p { margin: 0; font-size: 14px; color: var(--muted); }
.meta {
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  padding-top: 6px;
}
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tags span {
  font-size: 11px;
  letter-spacing: 0.06em;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 1px 9px;
  color: var(--muted);
}
.play {
  font-family: var(--display);
  font-size: 15px;
  color: var(--accent);
  white-space: nowrap;
}
.play::after { content: " →"; }

footer { color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .game { transition: none; } .game:hover { transform: none; } }
</style>

<div class="wrap">
  <header>
    <h1>あそびの<span>棚</span></h1>
    <p>ブラウザでそのまま遊べる小さなゲームを並べています。インストールも登録も不要で、スマホでもパソコンでも動きます。</p>
  </header>

  <main class="shelf" id="shelf"></main>
  <noscript><p>ゲームの一覧を表示するにはJavaScriptを有効にしてください。</p></noscript>

  <footer>各ゲームの左上「← あそびの棚」でこの一覧に戻れます。自己ベストはお使いのブラウザに保存されます。</footer>
</div>

<script src="games.js"></script>
<script>
(() => {
  const shelf = document.getElementById("shelf");
  const games = window.GAMES || [];
  // 2列×1段＋3列×n段 の棚。余りが出ないように、端数は横長の箱で埋める
  const n = games.length;
  const wideCount = n % 3 === 0 ? 0 : n % 3 === 1 ? 4 : 2;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  shelf.innerHTML = games.map((g, i) => `
    <a class="game${i < Math.min(wideCount, n) ? " wide" : ""}" href="games/${esc(g.id)}.html">
      <img class="thumb" src="thumbs/${esc(g.id)}.svg" alt="" width="320" height="180">
      <span class="info">
        <h2>${esc(g.title)}</h2>
        <p>${esc(g.description)}</p>
        <span class="meta"><span class="tags">${(g.tags || []).map(t => `<span>${esc(t)}</span>`).join("")}</span><span class="play">遊ぶ</span></span>
      </span>
    </a>`).join("");
})();
</script>
</body>
</html>
