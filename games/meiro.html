<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ひっくり返し迷路</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one-screen arcade cabinet — header strip, square rotating board, thumb-row controls */
:root {
  --bg: #141a31;
  --panel: #1c2443;
  --floor: #202a4f;
  --wall: #8b9fe6;
  --wall-hi: #c4cff8;
  --wall-lo: #5d6fb8;
  --ball: #ffc94a;
  --spike: #ff6b6b;
  --goal: #5ee0c0;
  --ink: #eef1fd;
  --muted: #8f99c4;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 500;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 16px;
  box-sizing: border-box;
  gap: 12px;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { min-width: 0; }
.brand h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 1.35rem;
  margin: 0;
  letter-spacing: 0.02em;
  line-height: 1.1;
}
.brand .lvname { color: var(--muted); font-size: 0.85rem; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats { display: flex; gap: 8px; }
.stat {
  background: var(--panel);
  border-radius: 10px;
  padding: 6px 10px;
  text-align: center;
  min-width: 52px;
}
.stat .k { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.08em; }
.stat .v { font-family: var(--font-display); font-size: 1.15rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat.over .v { color: var(--spike); }

.stage {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  position: relative;
  cursor: pointer;
}
.board {
  position: relative;
  transition: transform 300ms cubic-bezier(.5,-0.15,.3,1.2);
  will-change: transform;
}
.board canvas { display: block; border-radius: 14px; }
.board.shake { animation: shake 360ms ease; }
@keyframes shake {
  20% { translate: -6px 0; } 40% { translate: 6px 0; } 60% { translate: -4px 0; } 80% { translate: 3px 0; }
}
.gravity {
  position: absolute; bottom: -2px; left: 50%; translate: -50% 0;
  font-size: 0.7rem; color: var(--muted); letter-spacing: 0.1em; pointer-events: none;
  display: flex; align-items: center; gap: 4px;
}

.controls { display: grid; grid-template-columns: 1fr auto auto 1fr; gap: 8px; }
button {
  font-family: var(--font-body);
  font-weight: 800;
  color: var(--ink);
  background: var(--panel);
  border: 0;
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 0.9rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.25);
  transition: transform 80ms, background 120ms;
}
button:active { transform: translateY(2px); box-shadow: none; }
button:focus-visible { outline: 3px solid var(--goal); outline-offset: 2px; }
button.rot { background: var(--wall-lo); font-size: 1rem; padding-block: 16px; }
button.rot svg { width: 26px; height: 26px; }
button.small svg { width: 20px; height: 20px; }
button.hint-flash { animation: hintflash 0.5s ease 3; }
@keyframes hintflash { 50% { background: var(--goal); color: var(--bg); } }
.keys { text-align: center; font-size: 0.72rem; color: var(--muted); }
.keys kbd { font-family: var(--font-body); background: var(--panel); border-radius: 4px; padding: 1px 5px; }

.overlay {
  position: fixed; inset: 0;
  background: rgba(10, 13, 28, 0.78);
  backdrop-filter: blur(4px);
  display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  z-index: 20;
}
.card {
  background: var(--panel);
  border-radius: 20px;
  padding: 24px 22px;
  width: min(380px, 100%);
  box-sizing: border-box;
  text-align: center;
  display: flex; flex-direction: column; gap: 14px;
  max-height: 86vh; overflow: auto;
}
.card h2 { font-family: var(--font-display); font-weight: 400; margin: 0; font-size: 1.6rem; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); line-height: 1.6; }
.stars { font-size: 2.2rem; letter-spacing: 0.15em; }
.stars .on { color: var(--ball); }
.stars .off { color: var(--floor); }
.row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.row button { flex: 1; }
button.primary { background: var(--goal); color: var(--bg); }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grid button { flex-direction: column; gap: 2px; padding: 10px 4px; background: var(--floor); }
.grid button .n { font-family: var(--font-display); font-size: 1.2rem; font-weight: 400; }
.grid button .s { font-size: 0.7rem; color: var(--ball); letter-spacing: 0.05em; min-height: 1em; }
.grid button.cur { outline: 2px solid var(--goal); }
.grid button:disabled { opacity: 0.35; cursor: default; }
.how { text-align: left; font-size: 0.85rem; display: grid; gap: 6px; color: var(--muted); }
.how b { color: var(--ink); }
.legend { display: inline-block; width: 0.8em; height: 0.8em; border-radius: 50%; vertical-align: -1px; margin-right: 4px; }

@media (prefers-reduced-motion: reduce) {
  .board { transition-duration: 1ms; }
  .board.shake, button.hint-flash { animation: none; }
}
</style>

<div class="app">
  <header>
    <div class="brand"><a href="../" style="display:inline-block;font:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;color:inherit;opacity:.75;text-decoration:none;padding:2px 0">← あそびの棚</a>
      <h1>ひっくり返し迷路</h1>
      <div class="lvname" id="lvname">ステージ 1</div>
    </div>
    <div class="stats">
      <div class="stat" id="movesStat"><div class="k">手数</div><div class="v" id="moves">0</div></div>
      <div class="stat"><div class="k">目標</div><div class="v" id="par">-</div></div>
    </div>
  </header>

  <div class="stage" id="stage" aria-label="盤面。左半分をタップで左回転、右半分で右回転">
    <div class="board" id="board"><canvas id="cv"></canvas></div>
    <div class="gravity"><svg width="10" height="12" viewBox="0 0 10 12" aria-hidden="true"><path d="M5 0v9M1 6l4 5 4-5" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>重力はいつも下向き</div>
  </div>

  <div class="controls">
    <button class="rot" id="btnL" aria-label="左に回す">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 3v5h5"/></svg>左
    </button>
    <button class="small" id="btnReset" aria-label="やり直す">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
    <button class="small" id="btnMenu" aria-label="ステージ選択">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
    </button>
    <button class="rot" id="btnR" aria-label="右に回す">右
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 3v5h-5"/></svg>
    </button>
  </div>
  <div class="keys"><kbd>←</kbd><kbd>→</kbd> 回す　<kbd>R</kbd> やり直し　<kbd>H</kbd> ヒント　<button id="btnHint" style="display:inline-flex;padding:2px 10px;font-size:0.72rem;border-radius:8px;margin-left:4px">ヒント</button></div>
</div>

<div class="overlay" id="ovStart">
  <div class="card">
    <h2>ひっくり返し迷路</h2>
    <div class="how">
      <div>迷路ごと<b>90度回して</b>、ボールを転がします。重力はいつも画面の下向き。</div>
      <div><span class="legend" style="background:var(--ball)"></span>ボールは壁にぶつかるまで止まりません。</div>
      <div><span class="legend" style="background:var(--goal)"></span>緑のゴールに入ればクリア。</div>
      <div><span class="legend" style="background:var(--spike)"></span>赤いトゲに触れるとやり直し。</div>
      <div>少ない手数でクリアすると★が増えます。</div>
    </div>
    <div class="row"><button class="primary" id="btnStart">はじめる</button></div>
  </div>
</div>

<div class="overlay" id="ovClear" hidden>
  <div class="card">
    <h2 id="clearTitle">クリア！</h2>
    <div class="stars" id="clearStars"></div>
    <p id="clearMsg"></p>
    <div class="row">
      <button id="btnRetry">もう一度</button>
      <button class="primary" id="btnNext">次へ</button>
    </div>
  </div>
</div>

<div class="overlay" id="ovMenu" hidden>
  <div class="card">
    <h2>ステージ選択</h2>
    <p id="totalStars"></p>
    <div class="grid" id="lvgrid"></div>
    <div class="row"><button id="btnCloseMenu">閉じる</button></div>
  </div>
</div>

<script>
(() => {
// # 壁  . 床  S スタート  G ゴール  ^ トゲ
const LEVELS = [
  { name: "はじめの一歩", map: ["#######","#S....#","#####.#","#.....#","#.#####","#....G#","#######"] },
  { name: "トゲのとなり", map: ["#######","#.#.^^#","##....#","#..S^G#","##...##","#..#..#","#######"] },
  { name: "三つの谷", map: ["#########","#S#.....#","#.#.###.#","#...#G#.#","###.#.#.#","#^..#...#","#.###.###","#.......#","#########"] },
  { name: "ゴールは屋根裏", map: ["#######","#^^G###","#^#...#","##....#","#S...##","#..#.##","#######"] },
  { name: "すべり台", map: ["########","#..#...#","#G.....#","##.##.^#","#.^..S##","#^##...#","###..#.#","########"] },
  { name: "地下の小部屋", map: ["########","#..S.#.#","#.#..###","####.#.#","##.....#","#^.^...#","#^G##..#","########"] },
  { name: "折り返し", map: ["#########","#.^...#S#","#.###.#.#","#...#...#","###.#.###","#G#...#^#","#.#.###.#","#.......#","#########"] },
  { name: "トゲの森", map: ["#########","#.#..#^##","##.....##","#.#.....#","#G....###","##..#.S.#","#^^.###.#","#.^....##","#########"] },
  { name: "見えない近道", map: ["#########","#...#S###","###...#.#","#.#.....#","#^.^##..#","#G^#...##","#.....#.#","#.#..^..#","#########"] },
  { name: "広い倉庫", map: ["##########","#....#...#","#.#.^^...#","#.......S#","#..^.#.^.#","#..##....#","#.#...#..#","##...#..##","#G.###...#","##########"] },
  { name: "螺旋階段", map: ["##########","#......#.#","#^.##...##","#.#...#G##","#.##..^###","###..##.^#","#.#...S.##","#........#","#.^.##.###","##########"] },
  { name: "迷宮の芯", map: ["###########","#..#^...#.#","#.#..#....#","##.#^#S#..#","#.........#","##G#^.##..#","##.^.#...##","#..#.#.##.#","#.#......##","#....#...##","###########"] },
];

// 重力（盤面座標）: 回転 r=0..3（時計回り90°単位）
const GRAV = [[0,1],[1,0],[0,-1],[-1,0]];

function slide(g, x, y, r) {
  const [dx, dy] = GRAV[r];
  const path = [];
  for (;;) {
    const nx = x + dx, ny = y + dy, c = g[ny][nx];
    if (c === "#") return { x, y, res: "stop", path };
    x = nx; y = ny; path.push([x, y]);
    if (c === "^") return { x, y, res: "dead", path };
    if (c === "G") return { x, y, res: "goal", path };
  }
}
// 最短手数を探す。first は最初の一手（+1=右, -1=左）
function solve(g, x, y, r) {
  const q = [[x, y, r, 0, 0]], seen = new Set([x + "," + y + "," + r]);
  while (q.length) {
    const [cx, cy, cr, d, first] = q.shift();
    for (const dr of [1, -1]) {
      const nr = (cr + dr + 4) % 4;
      const t = slide(g, cx, cy, nr);
      const f = d === 0 ? dr : first;
      if (t.res === "goal") return { par: d + 1, first: f };
      if (t.res === "dead") continue;
      const k = t.x + "," + t.y + "," + nr;
      if (!seen.has(k)) { seen.add(k); q.push([t.x, t.y, nr, d + 1, f]); }
    }
  }
  return { par: -1, first: 0 };
}
function findS(g) { for (let y = 0; y < g.length; y++) { const x = g[y].indexOf("S"); if (x >= 0) return [x, y]; } }
const PARS = LEVELS.map(lv => {
  const g = lv.map, [sx, sy] = findS(g), s = slide(g, sx, sy, 0);
  return solve(g, s.x, s.y, 0).par;
});

// ---- 保存 ----
const KEY = "hikkuri-meiro-v1";
let best = {};
try { best = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { best = {}; }
function saveBest() { try { localStorage.setItem(KEY, JSON.stringify(best)); } catch (e) {} }

// ---- 状態 ----
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d"), boardEl = $("board");
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let C = {};
function readColors() { for (const k of ["floor","wall","wall-hi","wall-lo","ball","spike","goal","bg"]) C[k] = css("--" + k); }

let lvIdx = 0, grid = [], N = 7, ball = { x: 0, y: 0 }, r = 0, angle = 0, moves = 0;
let busy = false, anim = null, deadFx = null, winFx = null, hintUsed = false;
let cell = 40, gen = 0;

function loadLevel(i, keepAngle) {
  lvIdx = i;
  grid = LEVELS[i].map;
  N = grid.length;
  const [sx, sy] = findS(grid);
  ball = { x: sx, y: sy, fx: sx, fy: sy };
  moves = 0; hintUsed = false; deadFx = null; winFx = null; anim = null; gen++;
  r = 0;
  if (!keepAngle) { angle = Math.round(angle / 360) * 360; }
  boardEl.style.transform = `rotate(${angle}deg)`;
  $("lvname").textContent = `ステージ ${i + 1}　${LEVELS[i].name}`;
  $("par").textContent = PARS[i];
  updateHud();
  resize();
  busy = true;
  const my = gen;
  setTimeout(() => { if (my === gen) doSlide(() => { busy = false; }); }, 320);
}
function updateHud() {
  $("moves").textContent = moves;
  $("movesStat").classList.toggle("over", moves > PARS[lvIdx]);
}

function resize() {
  const st = $("stage").getBoundingClientRect();
  const side = Math.max(160, Math.min(st.width, st.height - 24) * 0.9);
  cell = Math.floor(side / N);
  const px = cell * N, dpr = window.devicePixelRatio || 1;
  cv.width = px * dpr; cv.height = px * dpr;
  cv.style.width = px + "px"; cv.style.height = px + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function rotate(dir) {
  if (busy) return;
  busy = true;
  r = (r + dir + 4) % 4;
  angle += dir * 90;
  boardEl.style.transform = `rotate(${angle}deg)`;
  moves++; updateHud();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const my = gen;
  setTimeout(() => { if (my === gen) doSlide(() => { busy = false; }); }, reduce ? 20 : 300);
}

function doSlide(done) {
  const t = slide(grid, ball.x, ball.y, r);
  if (!t.path.length) { done(); return; }
  const d = t.path.length;
  const dur = Math.sqrt(2 * d / 80) * 1000; // 加速度 80マス/s²
  anim = { fx: ball.x, fy: ball.y, tx: t.x, ty: t.y, start: performance.now(), dur, after: () => {
    ball.x = t.x; ball.y = t.y; ball.fx = t.x; ball.fy = t.y; anim = null;
    if (t.res === "dead") { die(); }
    else if (t.res === "goal") { win(); }
    else done();
  } };
}

function die() {
  deadFx = performance.now();
  boardEl.classList.remove("shake"); void boardEl.offsetWidth; boardEl.classList.add("shake");
  const my = gen;
  setTimeout(() => { boardEl.classList.remove("shake"); if (my === gen) loadLevel(lvIdx); }, 750);
}

function win() {
  winFx = performance.now();
  const par = PARS[lvIdx];
  let stars = moves <= par ? 3 : moves <= par + 2 ? 2 : 1;
  if (hintUsed) stars = Math.min(stars, 2);
  const prev = best[lvIdx] || 0;
  if (stars > prev) { best[lvIdx] = stars; saveBest(); }
  setTimeout(() => {
    $("clearStars").innerHTML = [0,1,2].map(i => `<span class="${i < stars ? "on" : "off"}">★</span>`).join("");
    const last = lvIdx === LEVELS.length - 1;
    $("clearTitle").textContent = last ? "全ステージ制覇！" : "クリア！";
    let msg = `${moves}手でゴール（目標 ${par}手）`;
    if (stars === 3) msg += "。最短手数です。";
    else if (hintUsed) msg += "。ヒントなしなら★3を狙えます。";
    else msg += `。あと${moves - par}手縮められます。`;
    $("clearMsg").textContent = msg;
    $("btnNext").textContent = last ? "ステージ選択" : "次へ";
    $("ovClear").hidden = false;
    $("btnNext").focus();
  }, 600);
}

function hint() {
  if (busy) return;
  const h = solve(grid, ball.x, ball.y, r);
  if (!h.first) return;
  hintUsed = true;
  const b = h.first > 0 ? $("btnR") : $("btnL");
  b.classList.remove("hint-flash"); void b.offsetWidth; b.classList.add("hint-flash");
  setTimeout(() => b.classList.remove("hint-flash"), 1600);
}

// ---- 描画 ----
function rr(x, y, w, h, rad) {
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, rad) : ctx.rect(x, y, w, h);
}
function draw(now) {
  const px = cell * N;
  ctx.clearRect(0, 0, px, px);
  ctx.fillStyle = C.floor; rr(0, 0, px, px, 14); ctx.fill();
  // 床のドット
  ctx.fillStyle = C.bg;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
    if (grid[y][x] !== "#") { ctx.beginPath(); ctx.arc((x + .5) * cell, (y + .5) * cell, Math.max(1, cell * .04), 0, 7); ctx.fill(); }
  const pad = Math.max(1, cell * 0.04), rad = cell * 0.18;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const c = grid[y][x], X = x * cell, Y = y * cell;
    if (c === "#") {
      ctx.fillStyle = C["wall-lo"]; rr(X + pad, Y + pad, cell - pad * 2, cell - pad * 2, rad); ctx.fill();
      ctx.fillStyle = C.wall; rr(X + pad, Y + pad, cell - pad * 2, cell - pad * 2 - cell * .1, rad); ctx.fill();
      ctx.fillStyle = C["wall-hi"]; rr(X + cell * .22, Y + cell * .16, cell * .3, cell * .1, cell * .05); ctx.fill();
    } else if (c === "^") {
      ctx.fillStyle = C.spike;
      const k = 3, w = (cell * .8) / k;
      for (let i = 0; i < k; i++) for (let j = 0; j < 2; j++) {
        const bx = X + cell * .1 + i * w + (j ? w / 2 : 0) - (j ? w * .25 : 0), by = Y + cell * (j ? .85 : .5);
        if (j && i === k - 1) continue;
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + w / 2, by - cell * .32); ctx.lineTo(bx + w, by); ctx.closePath(); ctx.fill();
      }
    } else if (c === "G") {
      const p = (Math.sin(now / 300) + 1) / 2;
      ctx.strokeStyle = C.goal; ctx.lineWidth = cell * .08;
      ctx.globalAlpha = .35 + p * .4;
      ctx.beginPath(); ctx.arc(X + cell / 2, Y + cell / 2, cell * (.32 + p * .08), 0, 7); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = C.goal; ctx.beginPath(); ctx.arc(X + cell / 2, Y + cell / 2, cell * .16, 0, 7); ctx.fill();
    }
  }
  // ボール
  let bx = ball.fx, by = ball.fy;
  if (anim) {
    let p = Math.min(1, (now - anim.start) / anim.dur);
    const e = p * p;
    bx = anim.fx + (anim.tx - anim.fx) * e; by = anim.fy + (anim.ty - anim.fy) * e;
    if (p >= 1) { const a = anim.after; ball.fx = anim.tx; ball.fy = anim.ty; a(); bx = ball.fx; by = ball.fy; }
  }
  let scale = 1, col = C.ball;
  if (deadFx) { const t = Math.min(1, (now - deadFx) / 400); scale = 1 + t * .5; ctx.globalAlpha = 1 - t; col = C.spike; }
  if (winFx) { const t = Math.min(1, (now - winFx) / 500); scale = 1 - t; }
  const cx = (bx + .5) * cell, cy = (by + .5) * cell, R = cell * .36 * scale;
  if (R > 0.5) {
    const g = ctx.createRadialGradient(cx - R * .35, cy - R * .4, R * .1, cx, cy, R);
    g.addColorStop(0, "#fff6d6"); g.addColorStop(.35, col); g.addColorStop(1, deadFx ? C.spike : "#d98a12");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}

// ---- メニュー ----
function openMenu() {
  const g = $("lvgrid"); g.innerHTML = "";
  let total = 0;
  LEVELS.forEach((lv, i) => {
    const s = best[i] || 0; total += s;
    const unlocked = i === 0 || best[i - 1] > 0 || s > 0;
    const b = document.createElement("button");
    b.id = "lv" + i;
    b.innerHTML = `<span class="n">${i + 1}</span><span class="s">${s ? "★".repeat(s) : ""}</span>`;
    if (i === lvIdx) b.classList.add("cur");
    b.disabled = !unlocked;
    b.onclick = () => { $("ovMenu").hidden = true; loadLevel(i); };
    g.appendChild(b);
  });
  $("totalStars").textContent = `集めた★ ${total} / ${LEVELS.length * 3}`;
  $("ovMenu").hidden = false;
}

// ---- 入力 ----
const overlayOpen = () => !$("ovStart").hidden || !$("ovClear").hidden || !$("ovMenu").hidden;
$("btnL").onclick = () => rotate(-1);
$("btnR").onclick = () => rotate(1);
$("btnReset").onclick = () => { if (!winFx) loadLevel(lvIdx); };
$("btnHint").onclick = hint;
$("btnMenu").onclick = openMenu;
$("btnCloseMenu").onclick = () => { $("ovMenu").hidden = true; };
$("btnStart").onclick = () => { $("ovStart").hidden = true; loadLevel(lvIdx); };
$("btnRetry").onclick = () => { $("ovClear").hidden = true; loadLevel(lvIdx); };
$("btnNext").onclick = () => {
  $("ovClear").hidden = true;
  if (lvIdx === LEVELS.length - 1) openMenu(); else loadLevel(lvIdx + 1);
};
$("stage").addEventListener("click", e => {
  if (overlayOpen()) return;
  const rc = $("stage").getBoundingClientRect();
  rotate(e.clientX < rc.left + rc.width / 2 ? -1 : 1);
});
addEventListener("keydown", e => {
  if (overlayOpen()) return;
  const k = e.key.toLowerCase();
  if (k === "arrowleft" || k === "a") { e.preventDefault(); rotate(-1); }
  else if (k === "arrowright" || k === "d") { e.preventDefault(); rotate(1); }
  else if (k === "r") { if (!winFx) loadLevel(lvIdx); }
  else if (k === "h") hint();
});
addEventListener("resize", resize);

// 続きから始める: 最初の未クリアステージ
const firstOpen = LEVELS.findIndex((_, i) => !best[i]);
lvIdx = firstOpen === -1 ? 0 : firstOpen;
readColors();
grid = LEVELS[lvIdx].map; N = grid.length;
const [sx0, sy0] = findS(grid); ball = { x: sx0, y: sy0, fx: sx0, fy: sy0 };
$("lvname").textContent = `ステージ ${lvIdx + 1}　${LEVELS[lvIdx].name}`;
$("par").textContent = PARS[lvIdx];
if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
resize();
requestAnimationFrame(draw);
})();
</script>
