<style>
/* Layout: full-bleed 3D stage under a lamp; thin HUD bands top and bottom, nothing over the box itself */
:root{
  --bg:#1a2030;          /* 藍の夜 */
  --bg-deep:#121722;
  --paper:#efe5cf;       /* 和紙 */
  --muted:#a3a9b8;
  --line:rgba(239,229,207,.16);
  --accent:#d9a650;      /* 山吹 */
  --accent-ink:#2a1d0a;
  --chip:rgba(239,229,207,.07);
  --font-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;}
body{background:var(--bg);color:var(--paper);font-family:var(--font-body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab;}
#stage.hover{cursor:pointer;}
#stage:active{cursor:grabbing;}

.hud{position:fixed;left:0;right:0;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.hud > *{pointer-events:auto;}
.top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.bottom{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;align-items:center;gap:12px;}

.brand{display:flex;flex-direction:column;gap:2px;}
.brand h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:1.9rem;letter-spacing:.12em;line-height:1.1;text-wrap:balance;}
.brand p{margin:0;color:var(--muted);font-size:.78rem;letter-spacing:.08em;}

.levels{display:flex;gap:6px;flex-wrap:wrap;}
.chip{font:500 .82rem var(--font-body);color:var(--paper);background:var(--chip);border:1px solid var(--line);
  padding:7px 12px;border-radius:999px;cursor:pointer;letter-spacing:.06em;transition:background .2s,border-color .2s;}
.chip:hover{border-color:rgba(239,229,207,.4);}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;}
.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.counter{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;}
.count-label{font-family:var(--font-display);font-size:1.05rem;letter-spacing:.1em;font-variant-numeric:tabular-nums;}
.count-label b{color:var(--accent);font-size:1.35rem;}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:min(92vw,420px);}
.dot{width:12px;height:12px;transform:rotate(45deg);border:1px solid rgba(239,229,207,.35);transition:background .25s,border-color .25s;}
.dot.done{background:var(--accent);border-color:var(--accent);}
.dot.now{border-color:var(--paper);}

.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.btn{font:500 .88rem var(--font-body);color:var(--paper);background:rgba(18,23,34,.72);backdrop-filter:blur(6px);
  border:1px solid var(--line);padding:9px 16px;border-radius:8px;cursor:pointer;letter-spacing:.06em;}
.btn:hover{border-color:rgba(239,229,207,.45);}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;}

.guide{color:var(--muted);font-size:.8rem;letter-spacing:.04em;text-align:center;margin:0;}

.toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;
  font-family:var(--font-display);font-size:1.5rem;letter-spacing:.2em;color:var(--paper);
  text-shadow:0 2px 12px rgba(0,0,0,.6);opacity:0;transition:opacity .25s, transform .4s;}
.toast.show{opacity:1;transform:translate(-50%,-62%);}
.toast.bad{color:var(--muted);}

.result{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);
  width:min(420px,calc(100% - 32px));background:rgba(18,23,34,.9);backdrop-filter:blur(8px);
  border:1px solid rgba(217,166,80,.5);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;}
.result h2{margin:0;font-family:var(--font-display);font-size:1.5rem;letter-spacing:.14em;color:var(--accent);}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.stat{display:flex;flex-direction:column;gap:2px;}
.stat span{font-size:.72rem;color:var(--muted);letter-spacing:.1em;}
.stat strong{font-size:1.2rem;font-variant-numeric:tabular-nums;}
.result .note{margin:0;font-size:.8rem;color:var(--muted);}

@media (max-width:520px){
  .brand h1{font-size:1.5rem;}
  .chip{padding:6px 10px;font-size:.78rem;}
  .toast{font-size:1.2rem;}
}
@media (prefers-reduced-motion:reduce){ .toast,.dot,.chip{transition:none;} }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 乱数 ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* ---------- 寸法 ---------- */
const W=3, H=1.5, D=2, T=0.12, STEP=0.1, PX=256;

/* ---------- テクスチャ ---------- */
const COL={ jindai:'#2e241d', mizuki:'#e8d8b2', nigaki:'#c99a4e', enju:'#8a5130', katsura:'#5b3a26', inner:'#c9a679' };

function grain(ctx,x,y,w,h,rng,alpha){
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  const n=Math.max(8,Math.floor(h/3));
  for(let i=0;i<n;i++){
    const yy=y+rng()*h, amp=1+rng()*4, freq=0.004+rng()*0.01, ph=rng()*6;
    ctx.strokeStyle = rng()<0.5 ? `rgba(0,0,0,${alpha*(0.4+rng()*0.8)})` : `rgba(255,240,210,${alpha*0.5*rng()})`;
    ctx.lineWidth=0.6+rng()*1.4;ctx.beginPath();
    for(let xx=x;xx<=x+w;xx+=8){const yv=yy+Math.sin(xx*freq+ph)*amp;xx===x?ctx.moveTo(xx,yv):ctx.lineTo(xx,yv);}
    ctx.stroke();
  }
  ctx.restore();
}

function tumblingBlocks(ctx,x,y,w,h,s,cols,rng){
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  const hw=s*Math.sqrt(3)/2;
  const rows=Math.ceil(h/(1.5*s))+2, colsN=Math.ceil(w/(2*hw))+2;
  for(let r=-1;r<rows;r++){
    for(let c=-1;c<colsN;c++){
      const cx=x+c*2*hw+(r&1?hw:0), cy=y+r*1.5*s;
      const p=[[0,-s],[hw,-s/2],[hw,s/2],[0,s],[-hw,s/2],[-hw,-s/2]].map(([a,b])=>[cx+a,cy+b]);
      const faces=[[p[5],p[0],p[1]],[p[1],p[2],p[3]],[p[3],p[4],p[5]]];
      faces.forEach((f,i)=>{
        ctx.fillStyle=cols[i];ctx.beginPath();ctx.moveTo(cx,cy);f.forEach(q=>ctx.lineTo(q[0],q[1]));ctx.closePath();ctx.fill();
        ctx.strokeStyle='rgba(30,20,12,.35)';ctx.lineWidth=0.8;ctx.stroke();
      });
    }
  }
  ctx.restore();
  grain(ctx,x,y,w,h,rng,0.06);
}

function asanoha(ctx,x,y,w,h,s,cols,rng){
  // 麻の葉: 菱形をつなぐ三角格子
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  const hw=s*Math.sqrt(3)/2;
  for(let r=-1;r<h/(1.5*s)+2;r++){
    for(let c=-1;c<w/(2*hw)+2;c++){
      const cx=x+c*2*hw+(r&1?hw:0), cy=y+r*1.5*s;
      const p=[[0,-s],[hw,-s/2],[hw,s/2],[0,s],[-hw,s/2],[-hw,-s/2]].map(([a,b])=>[cx+a,cy+b]);
      for(let i=0;i<6;i++){
        const a=p[i], b=p[(i+1)%6], m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
        [[a,m],[m,b]].forEach(([u,v],j)=>{
          ctx.fillStyle=cols[(i+j)%2===0?0:1];
          ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(u[0],u[1]);ctx.lineTo(v[0],v[1]);ctx.closePath();ctx.fill();
        });
      }
      ctx.strokeStyle=cols[2];ctx.lineWidth=1.4;
      p.forEach((q,i)=>{ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(q[0],q[1]);ctx.stroke();
        const b=p[(i+1)%6];ctx.beginPath();ctx.moveTo(q[0],q[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();});
    }
  }
  ctx.restore();
  grain(ctx,x,y,w,h,rng,0.05);
}

function panelTexture(wu,hu,variant,seed){
  const cw=Math.round(wu*PX), ch=Math.round(hu*PX);
  const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
  const ctx=cv.getContext('2d'), rng=mulberry32(seed);
  ctx.fillStyle=COL.jindai;ctx.fillRect(0,0,cw,ch);grain(ctx,0,0,cw,ch,rng,0.12);
  const b=Math.round(0.08*PX), st=Math.round(0.025*PX);
  ctx.fillStyle=COL.mizuki;ctx.fillRect(b,b,cw-2*b,ch-2*b);
  ctx.fillStyle=COL.enju;ctx.fillRect(b+st,b+st,cw-2*(b+st),ch-2*(b+st));
  const f=b+st*2;
  if(variant==='asa') asanoha(ctx,f,f,cw-2*f,ch-2*f,0.16*PX,[COL.nigaki,COL.mizuki,COL.katsura],rng);
  else tumblingBlocks(ctx,f,f,cw-2*f,ch-2*f,0.1*PX,variant==='b'?[COL.nigaki,COL.katsura,COL.mizuki]:[COL.mizuki,COL.nigaki,COL.katsura],rng);
  // 縁の陰影
  const g=ctx.createLinearGradient(0,0,0,ch);g.addColorStop(0,'rgba(255,240,210,.06)');g.addColorStop(1,'rgba(0,0,0,.12)');
  ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);
  return toTex(cv);
}
function plainWood(color,seed,alpha){
  const cv=document.createElement('canvas');cv.width=512;cv.height=256;
  const ctx=cv.getContext('2d');ctx.fillStyle=color;ctx.fillRect(0,0,512,256);
  grain(ctx,0,0,512,256,mulberry32(seed),alpha);return toTex(cv);
}
let renderer;
function toTex(cv){const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;t.anisotropy=renderer?renderer.capabilities.getMaxAnisotropy():4;return t;}

/* ---------- シーン ---------- */
const canvas=document.getElementById('stage');
renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;

const scene=new THREE.Scene();
scene.background=new THREE.Color('#1a2030');
scene.fog=new THREE.Fog('#1a2030',12,26);
const camera=new THREE.PerspectiveCamera(36,1,0.1,100);
camera.position.set(5.2,4.0,6.4);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=0.08;controls.enablePan=false;
controls.minDistance=4.5;controls.maxDistance=14;controls.maxPolarAngle=Math.PI*0.49;
controls.target.set(0,-0.1,0);

scene.add(new THREE.HemisphereLight(0xc8d4ff,0x2a1c10,0.55));
const lamp=new THREE.DirectionalLight(0xffe2b8,1.6);
lamp.position.set(4,8,5);lamp.castShadow=true;lamp.shadow.mapSize.set(2048,2048);
Object.assign(lamp.shadow.camera,{left:-5,right:5,top:5,bottom:-5,near:1,far:20});lamp.shadow.bias=-0.0006;
scene.add(lamp);
const rim=new THREE.DirectionalLight(0x8fa6d8,0.45);rim.position.set(-5,3,-4);scene.add(rim);

// 卓: 灯りの輪
(function(){
  const cv=document.createElement('canvas');cv.width=cv.height=512;const c=cv.getContext('2d');
  const g=c.createRadialGradient(256,256,10,256,256,256);
  g.addColorStop(0,'#4a3a2c');g.addColorStop(.45,'#2c2a30');g.addColorStop(1,'#1a2030');
  c.fillStyle=g;c.fillRect(0,0,512,512);
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(22,22),new THREE.MeshStandardMaterial({map:toTex(cv),roughness:.95}));
  floor.rotation.x=-Math.PI/2;floor.position.y=-H/2-T-0.001;floor.receiveShadow=true;scene.add(floor);
})();

/* ---------- 箱 ---------- */
const innerTex=plainWood(COL.inner,11,0.1);
const innerMat=()=>new THREE.MeshStandardMaterial({map:innerTex,roughness:.7,emissive:0x000000});
const edgeTex=plainWood('#a77a4c',12,0.14);
const edgeMat=()=>new THREE.MeshStandardMaterial({map:edgeTex,roughness:.6,emissive:0x000000});

const box=new THREE.Group();scene.add(box);
const panels={};

function makePanel(id,size,pos,axis,outerFace,tex){
  const mats=[0,1,2,3,4,5].map(i=>{
    if(i===outerFace) return new THREE.MeshStandardMaterial({map:tex,roughness:.48,metalness:0,emissive:0x000000});
    return (outerFace===2 && i===3) || (outerFace===4&&i===5) || (outerFace===5&&i===4) || (outerFace===0&&i===1) || (outerFace===1&&i===0) ? innerMat() : edgeMat();
  });
  const m=new THREE.Mesh(new THREE.BoxGeometry(...size),mats);
  m.castShadow=true;m.receiveShadow=true;m.position.set(...pos);
  m.userData={id};box.add(m);
  panels[id]={mesh:m,base:new THREE.Vector3(...pos),axis:new THREE.Vector3(...axis),offset:0,target:0,count:0,wiggle:0,glow:0,hover:0,mats};
}

function buildBox(seed){
  // 古いものを片付ける
  Object.values(panels).forEach(p=>{p.mesh.geometry.dispose();p.mats.forEach(m=>{if(m.map&&m.map!==innerTex&&m.map!==edgeTex)m.map.dispose();m.dispose();});box.remove(p.mesh);});
  for(const k in panels) delete panels[k];
  const r=mulberry32(seed), v=['a','b'];
  const pick=()=>v[Math.floor(r()*2)];
  makePanel('F',[W,H,T],[0,0,D/2-T/2],[1,0,0],4,panelTexture(W,H,pick(),seed+1));
  makePanel('B',[W,H,T],[0,0,-D/2+T/2],[-1,0,0],5,panelTexture(W,H,pick(),seed+2));
  makePanel('L',[T,H,D-2*T],[-W/2+T/2,0,0],[0,1,0],1,panelTexture(D-2*T,H,pick(),seed+3));
  makePanel('R',[T,H,D-2*T],[W/2-T/2,0,0],[0,1,0],0,panelTexture(D-2*T,H,pick(),seed+4));
  makePanel('T',[W,T,D],[0,H/2+T/2,0],[1,0,0],2,panelTexture(W,D,'asa',seed+5));
}
// 底板 (固定)
const bottom=new THREE.Mesh(new THREE.BoxGeometry(W,T,D),[edgeMat(),edgeMat(),innerMat(),edgeMat(),edgeMat(),edgeMat()]);
bottom.position.y=-H/2-T/2;bottom.castShadow=true;bottom.receiveShadow=true;box.add(bottom);

// 中身: 折り文と小判
const treasure=new THREE.Group();box.add(treasure);
let noteMesh=null;
function makeNote(){
  const cv=document.createElement('canvas');cv.width=640;cv.height=400;const c=cv.getContext('2d');
  c.fillStyle='#f3ead6';c.fillRect(0,0,640,400);grain(c,0,0,640,400,mulberry32(5),0.03);
  c.strokeStyle='#b33a2a';c.lineWidth=6;c.strokeRect(24,24,592,352);
  c.fillStyle='#2b1d12';c.textAlign='center';c.textBaseline='middle';
  c.font='800 120px "Shippori Mincho B1", serif';c.fillText('開',320,170);
  c.font='600 34px "Shippori Mincho B1", serif';c.fillText(LEVEL_NAME[level]+'仕掛け 解き明かし',320,290);
  c.fillStyle='#b33a2a';c.fillRect(520,300,56,56);c.fillStyle='#f3ead6';c.font='800 30px "Shippori Mincho B1", serif';c.fillText('印',548,330);
  if(noteMesh){treasure.remove(noteMesh);noteMesh.material.map.dispose();}
  noteMesh=new THREE.Mesh(new THREE.PlaneGeometry(1.7,1.06),new THREE.MeshStandardMaterial({map:toTex(cv),roughness:.9}));
  noteMesh.rotation.x=-Math.PI/2;noteMesh.rotation.z=0.08;noteMesh.position.set(-0.3,-H/2+0.004,0.05);noteMesh.receiveShadow=true;
  treasure.add(noteMesh);
}
const coin=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.04,48),new THREE.MeshStandardMaterial({color:0xd8b25a,metalness:.85,roughness:.28}));
coin.scale.set(1,1,1.55);coin.position.set(0.85,-H/2+0.03,-0.2);coin.rotation.y=0.4;coin.castShadow=true;treasure.add(coin);

/* ---------- 状態 ---------- */
const LEVEL_NAME={4:'四回',7:'七回',12:'十二回'};
let level=7, seed=Math.floor(Math.random()*1e6), seq=[], step=0, moves=0, hints=0, startTime=0, solved=false, lidT=0, lidOpening=false;

function buildSequence(n,s){
  const r=mulberry32(s*31+n), ids=['F','B','L','R'], cnt={F:0,B:0,L:0,R:0}, cap=Math.ceil((n-1)/4)+1, out=[];
  while(out.length<n-1){
    const opts=ids.filter(i=>i!==out[out.length-1]&&cnt[i]<cap);
    const i=opts[Math.floor(r()*opts.length)];out.push(i);cnt[i]++;
  }
  out.push('T');return out;
}

function startGame(keepSeed){
  if(!keepSeed) seed=Math.floor(Math.random()*1e6);
  buildBox(seed);
  seq=buildSequence(level,seed);
  resetState();
}
function resetState(){
  step=0;moves=0;hints=0;startTime=0;solved=false;lidT=0;lidOpening=false;
  Object.values(panels).forEach(p=>{p.offset=p.target=0;p.count=0;p.wiggle=0;p.glow=0;});
  panels.T.mesh.position.copy(panels.T.base);panels.T.mesh.rotation.set(0,0,0);
  treasure.visible=false;
  document.getElementById('result').hidden=true;document.getElementById('bottomBar').hidden=false;
  updateHUD();
}

/* ---------- HUD ---------- */
const dotsEl=document.getElementById('dots'), countEl=document.getElementById('countLabel');
function updateHUD(){
  countEl.innerHTML=`仕掛け <b>${step}</b> / ${level}`;
  dotsEl.innerHTML='';
  for(let i=0;i<level;i++){const d=document.createElement('span');d.className='dot'+(i<step?' done':i===step&&!solved?' now':'');dotsEl.appendChild(d);}
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(+c.dataset.lv===level)));
}
const toastEl=document.getElementById('toast');let toastTimer;
function toast(msg,bad){
  toastEl.textContent=msg;toastEl.className='toast'+(bad?' bad':'');void toastEl.offsetWidth;toastEl.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),850);
}

/* ---------- 音 ---------- */
let ac=null;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac;}
function knock(freq,dur,gain){
  const a=audio();if(!a)return;
  const len=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,4);
  const src=a.createBufferSource();src.buffer=buf;
  const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=freq;bp.Q.value=6;
  const g=a.createGain();g.gain.value=gain;src.connect(bp).connect(g).connect(a.destination);src.start();
}
function chime(){
  const a=audio();if(!a)return;[0,0.14,0.28,0.5].forEach((t,i)=>{
    const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=[784,880,1047,1319][i];
    g.gain.setValueAtTime(0,a.currentTime+t);g.gain.linearRampToValueAtTime(.12,a.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t+1.4);
    o.connect(g).connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+1.5);});
}

/* ---------- 操作 ---------- */
const GOOD=['カタッ','コトリ','すっと動いた','わずかに滑った'];
function press(id){
  if(solved||lidOpening)return;
  if(!startTime)startTime=performance.now();
  moves++;
  const p=panels[id];
  if(seq[step]===id){
    if(id==='T'){openLid();return;}
    p.count++;p.target=p.count*STEP;step++;
    knock(1900,0.05,0.9);toast(GOOD[Math.floor(Math.random()*GOOD.length)]);
    if(step===level-1) setTimeout(()=>{if(step===level-1&&!solved)toast('何かが外れた音がした');},700);
  }else if(step>0&&seq[step-1]===id){
    p.count--;p.target=p.count*STEP;step--;
    knock(1400,0.05,0.7);toast('一手戻した');
  }else{
    p.wiggle=1;knock(380,0.08,1.1);toast('びくともしない',true);
  }
  updateHUD();
}
function openLid(){
  lidOpening=true;step=level;updateHUD();
  makeNote();treasure.visible=true;
  knock(1600,0.06,1);setTimeout(()=>knock(900,0.08,0.8),180);
}
function finish(){
  solved=true;lidOpening=false;chime();updateHUD();
  const secs=Math.round((performance.now()-startTime)/1000);
  document.getElementById('sMoves').textContent=moves;
  document.getElementById('sHints').textContent=hints;
  document.getElementById('sTime').textContent=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
  let best=null,key='karakuri-best-'+level;
  try{best=+localStorage.getItem(key)||null;if(!best||moves<best){localStorage.setItem(key,moves);}}catch(e){}
  document.getElementById('sBest').textContent = best && moves>=best ? `${LEVEL_NAME[level]}仕掛けの最少手数は ${best} 手です。最短は ${level} 手。` : `${LEVEL_NAME[level]}仕掛けの自己最少記録です。最短は ${level} 手。`;
  document.getElementById('bottomBar').hidden=true;document.getElementById('result').hidden=false;
}

document.getElementById('hintBtn').onclick=()=>{
  if(solved||lidOpening)return;hints++;panels[seq[step]].glow=1;
  toast(seq[step]==='T'?'蓋を押してみよう':'光った板を押してみよう');
};
document.getElementById('resetBtn').onclick=()=>{resetState();toast('箱を閉じ直した');};
document.getElementById('newBtn').onclick=()=>{startGame(false);toast('新しい箱');};
document.getElementById('againBtn').onclick=()=>resetState();
document.getElementById('nextBtn').onclick=()=>startGame(false);
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{level=+c.dataset.lv;startGame(false);});

// ピッキング
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let downAt=null,hovered=null;
function pick(e){
  const r=canvas.getBoundingClientRect();ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(Object.values(panels).map(p=>p.mesh),false)[0];
  return hit?hit.object.userData.id:null;
}
canvas.addEventListener('pointerdown',e=>{downAt={x:e.clientX,y:e.clientY,t:performance.now()};audio();});
canvas.addEventListener('pointerup',e=>{
  if(!downAt)return;const dx=e.clientX-downAt.x,dy=e.clientY-downAt.y;
  if(dx*dx+dy*dy<64&&performance.now()-downAt.t<600){const id=pick(e);if(id)press(id);}
  downAt=null;
});
canvas.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'||downAt){return;}
  hovered=solved?null:pick(e);canvas.classList.toggle('hover',!!hovered);
});
canvas.addEventListener('pointerleave',()=>{hovered=null;canvas.classList.remove('hover');});

/* ---------- ループ ---------- */
function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.fov=w/h<0.8?50:36;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

const clock=new THREE.Clock();
const tmp=new THREE.Vector3();
function loop(){
  const dt=Math.min(clock.getDelta(),0.05), now=clock.elapsedTime;
  for(const id in panels){
    const p=panels[id];
    p.offset+=(p.target-p.offset)*Math.min(1,dt*(reduceMotion?30:14));
    let wig=0;if(p.wiggle>0){p.wiggle=Math.max(0,p.wiggle-dt*3.2);wig=Math.sin(now*55)*0.014*p.wiggle;}
    if(id!=='T'||(!lidOpening&&!solved)){
      p.mesh.position.copy(p.base).addScaledVector(p.axis,p.offset+wig);
    }
    if(p.glow>0)p.glow=Math.max(0,p.glow-dt*0.6);
    p.hover+=((hovered===id?1:0)-p.hover)*Math.min(1,dt*10);
    const gl=p.glow>0?(0.5+0.5*Math.sin(now*8))*p.glow:0;
    const e=gl*0.35+p.hover*0.08;
    p.mats.forEach(m=>m.emissive.setRGB(e,e*0.72,e*0.3));
  }
  if(lidOpening||solved){
    lidT=Math.min(1,lidT+dt/(reduceMotion?0.3:1.8));
    const k=lidT<.5?2*lidT*lidT:1-Math.pow(-2*lidT+2,2)/2;
    const L=panels.T;
    L.mesh.position.set(L.base.x+k*3.4,L.base.y+Math.max(0,k-0.6)*0.6,L.base.z);
    L.mesh.rotation.z=-Math.max(0,k-0.6)*0.25;
    if(lidT>=1&&lidOpening)finish();
  }
  coin.rotation.y+=treasure.visible?dt*0.4:0;
  controls.update();renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

/* ---------- 起動 ---------- */
function start(data){
  if(data&&data.level){level=data.level;seed=data.seed;}
  startGame(true);
  if(data&&data.step&&data.step<level){
    for(let i=0;i<data.step;i++){const p=panels[seq[i]];p.count++;p.target=p.offset=p.count*STEP;}
    step=data.step;moves=data.moves||0;hints=data.hints||0;startTime=performance.now();updateHUD();
  }
  loop();
}
window.claude?.hot?.snapshot?.(()=>({level,seed,step:solved?0:step,moves,hints}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body></html>
